services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # Public HTTP for Coolify reverse proxy (domain → service frontend, port 3000).
    # Do not publish a host port (conflicts with other apps / Coolify).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      GOOGLE_SHEET_URL: ${GOOGLE_SHEET_URL:-}
      AUTH_EMAIL: ${AUTH_EMAIL:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      MAYTAPI_PRODUCT_ID: ${MAYTAPI_PRODUCT_ID:-}
      MAYTAPI_TOKEN: ${MAYTAPI_TOKEN:-}
      MAYTAPI_PHONE_ID: ${MAYTAPI_PHONE_ID:-}
      MAYTAPI_TO_NUMBERS: ${MAYTAPI_TO_NUMBERS:-}
      REPORT_CRON: ${REPORT_CRON:-}
      REPORT_CRON_HOUR: ${REPORT_CRON_HOUR:-6}
      REPORT_CRON_MINUTE: ${REPORT_CRON_MINUTE:-15}
      REPORT_STATE_DIR: /app/state
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - report-state:/app/state
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  report-state:
